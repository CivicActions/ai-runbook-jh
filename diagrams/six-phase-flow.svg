<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- ============ HEADER ============ -->
  <text x="80" y="55" font-size="30" font-weight="700" fill="#1b1b1b">ai-runbook-jh <tspan font-size="20" font-weight="500" fill="#565c65">: AI-Assisted Ticket Workflow</tspan></text>
  <text x="80" y="84" font-size="15" fill="#565c65">A 6-phase process with AI skills that codify each. Voice and security as keystones.</text>
  <text x="1520" y="50" text-anchor="end" font-size="13" fill="#565c65">ai-runbook-jh</text>
  <text x="1520" y="68" text-anchor="end" font-size="13" fill="#565c65">CivicActions</text>
  <text x="1520" y="86" text-anchor="end" font-size="13" fill="#71767a">Framework v1 / May 2026</text>
  <line x1="80" y1="108" x2="1520" y2="108" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ============ SECTION LABELS ============ -->
  <text x="285" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#71767a" letter-spacing="3">PRE-DEVELOPMENT</text>
  <text x="980" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1a4480" letter-spacing="3">DEVELOPMENT</text>

  <!-- ============ TRANSITION LABEL + DIVIDER ============ -->
  <g>
    <text x="490" y="146" text-anchor="middle" font-size="10" fill="#565c65">PM/Practice Area: Ready for Est → Ready for Dev →</text>
    <text x="490" y="161" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4480">"Selected for Development"</text>
    <line x1="490" y1="170" x2="490" y2="490" stroke="#71767a" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>

  <!-- ============ PHASE BOXES ============ -->
  <!-- Phase number circles are now centered above the title so titles aren't visually shifted -->

  <!-- Phase 1: Triage (box center x = 185) -->
  <g>
    <rect x="100" y="170" width="170" height="320" fill="#f0f7fc" stroke="#1a4480" stroke-width="1.5" rx="6"/>
    <circle cx="185" cy="188" r="10" fill="#1a4480"/>
    <text x="185" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="185" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1b">Triage</text>
    <text x="185" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#1b1b1b">First touch</text>
    <text x="185" y="262" text-anchor="middle" font-size="10" fill="#565c65">Keep / defer / decline.</text>
    <text x="185" y="277" text-anchor="middle" font-size="10" fill="#565c65">Min fields, initial</text>
    <text x="185" y="292" text-anchor="middle" font-size="10" fill="#565c65">priority, reviewed tag.</text>
    <line x1="125" y1="310" x2="245" y2="310" stroke="#aacdec" stroke-width="1"/>
    <text x="185" y="332" text-anchor="middle" font-size="9" font-weight="700" fill="#71767a" letter-spacing="2">SKILL</text>
    <text x="185" y="356" text-anchor="middle" font-size="11" fill="#1a4480" font-family="ui-monospace, 'SF Mono', 'Menlo', 'Courier New', monospace">triage</text>
  </g>

  <!-- Phase 2: Refinement (box center x = 375) -->
  <g>
    <rect x="290" y="170" width="170" height="320" fill="#f0f7fc" stroke="#1a4480" stroke-width="1.5" rx="6"/>
    <circle cx="375" cy="188" r="10" fill="#1a4480"/>
    <text x="375" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="375" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1b">Refinement</text>
    <text x="375" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#1b1b1b">Prep for Estimation</text>
    <text x="375" y="262" text-anchor="middle" font-size="10" fill="#565c65">User story, AC,</text>
    <text x="375" y="277" text-anchor="middle" font-size="10" fill="#565c65">dependencies, DoD.</text>
    <line x1="315" y1="310" x2="435" y2="310" stroke="#aacdec" stroke-width="1"/>
    <text x="375" y="332" text-anchor="middle" font-size="9" font-weight="700" fill="#71767a" letter-spacing="2">SKILLS</text>
    <text x="375" y="356" text-anchor="middle" font-size="10" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">ticket-refinement</text>
    <text x="375" y="376" text-anchor="middle" font-size="10" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">definition-of-done</text>
  </g>

  <!-- Phase 3: Plan (box center x = 605) -->
  <g>
    <rect x="520" y="170" width="170" height="320" fill="#dbe9f7" stroke="#1a4480" stroke-width="2" rx="6"/>
    <circle cx="605" cy="188" r="10" fill="#1a4480"/>
    <text x="605" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="605" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1b">Plan</text>
    <text x="605" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#1b1b1b">Write the approach</text>
    <text x="605" y="262" text-anchor="middle" font-size="10" fill="#565c65">Plan file before code.</text>
    <text x="605" y="277" text-anchor="middle" font-size="10" fill="#565c65">Steps, risks, scope,</text>
    <text x="605" y="292" text-anchor="middle" font-size="10" fill="#565c65">impl details, branch.</text>
    <line x1="545" y1="310" x2="665" y2="310" stroke="#7eb0db" stroke-width="1"/>
    <text x="605" y="332" text-anchor="middle" font-size="9" font-weight="700" fill="#71767a" letter-spacing="2">SKILLS</text>
    <text x="605" y="356" text-anchor="middle" font-size="10" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">issue-plan</text>
    <text x="605" y="376" text-anchor="middle" font-size="10" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">implementation-details</text>
  </g>

  <!-- Phase 4: Build (box center x = 795) -->
  <g>
    <rect x="710" y="170" width="170" height="320" fill="#dbe9f7" stroke="#1a4480" stroke-width="2" rx="6"/>
    <circle cx="795" cy="188" r="10" fill="#1a4480"/>
    <text x="795" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <text x="795" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1b">Build</text>
    <text x="795" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#1b1b1b">Implement</text>
    <text x="795" y="262" text-anchor="middle" font-size="10" fill="#565c65">Pattern + simplicity</text>
    <text x="795" y="277" text-anchor="middle" font-size="10" fill="#565c65">checks. Handoff mid-</text>
    <text x="795" y="292" text-anchor="middle" font-size="10" fill="#565c65">session to carry state.</text>
    <line x1="735" y1="310" x2="855" y2="310" stroke="#7eb0db" stroke-width="1"/>
    <text x="795" y="332" text-anchor="middle" font-size="9" font-weight="700" fill="#71767a" letter-spacing="2">SKILLS</text>
    <text x="795" y="356" text-anchor="middle" font-size="10" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">frontend-design</text>
    <text x="795" y="373" text-anchor="middle" font-size="10" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">kiss</text>
    <text x="795" y="390" text-anchor="middle" font-size="10" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">pattern-alignment</text>
    <text x="795" y="407" text-anchor="middle" font-size="10" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">handoff-message</text>
  </g>

  <!-- Phase 5: Validate (box center x = 985) -->
  <g>
    <rect x="900" y="170" width="170" height="320" fill="#dbe9f7" stroke="#1a4480" stroke-width="2" rx="6"/>
    <circle cx="985" cy="188" r="10" fill="#1a4480"/>
    <text x="985" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <text x="985" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1b">Validate</text>
    <text x="985" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#1b1b1b">Confirm it works</text>
    <text x="985" y="262" text-anchor="middle" font-size="10" fill="#565c65">Browser, a11y, responsive,</text>
    <text x="985" y="277" text-anchor="middle" font-size="10" fill="#565c65">perf, peer review.</text>
    <line x1="925" y1="310" x2="1045" y2="310" stroke="#7eb0db" stroke-width="1"/>
    <text x="985" y="332" text-anchor="middle" font-size="9" font-weight="700" fill="#71767a" letter-spacing="2">SKILLS</text>
    <text x="985" y="354" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">browser-check</text>
    <text x="985" y="370" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">accessibility-audit</text>
    <text x="985" y="386" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">responsive-design</text>
    <text x="985" y="402" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">performance-frontend</text>
    <text x="985" y="418" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">frontend-peer-review</text>
    <text x="985" y="434" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">drupal-critic</text>
  </g>

  <!-- Phase 6: Communicate (wider, box center x = 1270) -->
  <g>
    <rect x="1090" y="170" width="360" height="320" fill="#dbe9f7" stroke="#1a4480" stroke-width="2" rx="6"/>
    <circle cx="1270" cy="188" r="10" fill="#1a4480"/>
    <text x="1270" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
    <text x="1270" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1b">Communicate</text>
    <text x="1270" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#1b1b1b">Hand off, reflect</text>
    <text x="1270" y="262" text-anchor="middle" font-size="10" fill="#565c65">Clean commits, QA steps,</text>
    <text x="1270" y="277" text-anchor="middle" font-size="10" fill="#565c65">closure notes, and lessons</text>
    <text x="1270" y="292" text-anchor="middle" font-size="10" fill="#565c65">captured at handoff time.</text>
    <line x1="1115" y1="310" x2="1425" y2="310" stroke="#7eb0db" stroke-width="1"/>
    <text x="1270" y="332" text-anchor="middle" font-size="9" font-weight="700" fill="#71767a" letter-spacing="2">SKILLS</text>
    <text x="1270" y="354" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">organize-commits</text>
    <text x="1270" y="370" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">squash-commits</text>
    <text x="1270" y="386" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">commit-message-writer</text>
    <text x="1270" y="402" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">summarize-commits</text>
    <text x="1270" y="418" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">qa-steps</text>
    <text x="1270" y="434" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">issue-closure-notes</text>
    <text x="1270" y="450" text-anchor="middle" font-size="9.5" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">lessons-learned</text>
  </g>

  <!-- Flow arrows between phases (5 arrows for 6 phases) -->
  <g fill="#1a4480">
    <polygon points="275,330 287,335 275,340"/>
    <polygon points="465,330 477,335 465,340"/>
    <polygon points="695,330 707,335 695,340"/>
    <polygon points="885,330 897,335 885,340"/>
    <polygon points="1075,330 1087,335 1075,340"/>
  </g>

  <!-- ============ JIRA STATUS CAPTIONS ============ -->
  <text x="80" y="513" font-size="9" font-weight="700" fill="#71767a" letter-spacing="2">JIRA</text>
  <g font-style="italic" font-size="10" fill="#565c65" text-anchor="middle">
    <text x="185" y="513">Open</text>
    <text x="375" y="513">Open → Ready for Est</text>
    <text x="605" y="513">Selected → In Progress</text>
    <text x="795" y="513">In Progress</text>
    <text x="985" y="513">In Progress</text>
    <text x="1270" y="513">→ UXQA/VXQA → Code Review → QA → Done</text>
  </g>
  <text x="1520" y="535" text-anchor="end" font-size="9" font-style="italic" fill="#71767a">Kickbacks from UXQA/VXQA, Code Review, or QA may return ticket to In Progress.</text>

  <!-- ============ CROSS-CUTTING SECTION ============ -->
  <text x="80" y="555" font-size="11" font-weight="700" fill="#71767a" letter-spacing="3">CROSS-CUTTING CONCERNS</text>
  <line x1="80" y1="568" x2="1520" y2="568" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Voice -->
  <g>
    <rect x="80" y="585" width="700" height="80" fill="#f5f0fa" rx="4"/>
    <rect x="80" y="585" width="6" height="80" fill="#54278f"/>
    <text x="105" y="610" font-size="14" font-weight="700" fill="#54278f" letter-spacing="1">VOICE</text>
    <text x="105" y="632" font-size="11" fill="#1b1b1b">The keystone. Every phase produces prose; a project voice config keeps the system from reading like 23 different writers.</text>
    <text x="105" y="652" font-size="11" font-family="ui-monospace, 'SF Mono', monospace" fill="#54278f">check-tone</text>
    <text x="200" y="652" font-size="11" fill="#565c65">+</text>
    <text x="215" y="652" font-size="11" font-family="ui-monospace, 'SF Mono', monospace" fill="#54278f">.agents/style/voice.md</text>
  </g>

  <!-- Security -->
  <g>
    <rect x="820" y="585" width="700" height="80" fill="#faf0f0" rx="4"/>
    <rect x="820" y="585" width="6" height="80" fill="#b50909"/>
    <text x="845" y="610" font-size="14" font-weight="700" fill="#b50909" letter-spacing="1">SECURITY</text>
    <text x="845" y="632" font-size="11" fill="#1b1b1b">Pre-flight gate. Sanctioned vs. sensitive. AI is a thinking partner, not an auth agent, not a higher-env actor.</text>
    <text x="845" y="652" font-size="11" font-family="ui-monospace, 'SF Mono', monospace" fill="#b50909">security-check</text>
    <text x="945" y="652" font-size="11" fill="#565c65">+ aligned to CA AI Usage Policy + NIST AI RMF</text>
  </g>

  <!-- ============ FOUNDATION SKILLS SECTION ============ -->
  <text x="80" y="710" font-size="11" font-weight="700" fill="#71767a" letter-spacing="3">FOUNDATION SKILLS</text>
  <text x="280" y="710" font-size="11" fill="#71767a">(invoked by other skills more than used alone)</text>
  <line x1="80" y1="722" x2="1520" y2="722" stroke="#e0e0e0" stroke-width="1"/>

  <g>
    <!-- browser-check -->
    <rect x="80" y="740" width="280" height="80" fill="#fffbe8" stroke="#ffbe2e" stroke-width="1" rx="4"/>
    <text x="220" y="765" text-anchor="middle" font-size="12" font-weight="700" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">browser-check</text>
    <text x="220" y="787" text-anchor="middle" font-size="10" fill="#565c65">Live page validation via chrome-devtools.</text>
    <text x="220" y="802" text-anchor="middle" font-size="10" fill="#565c65">Invoked by all Validate skills.</text>

    <!-- definition-of-done -->
    <rect x="380" y="740" width="280" height="80" fill="#fffbe8" stroke="#ffbe2e" stroke-width="1" rx="4"/>
    <text x="520" y="765" text-anchor="middle" font-size="12" font-weight="700" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">definition-of-done</text>
    <text x="520" y="787" text-anchor="middle" font-size="10" fill="#565c65">Canonical DoD per ticket type.</text>
    <text x="520" y="802" text-anchor="middle" font-size="10" fill="#565c65">Used by refinement, QA, closure.</text>

    <!-- implementation-details -->
    <rect x="680" y="740" width="280" height="80" fill="#fffbe8" stroke="#ffbe2e" stroke-width="1" rx="4"/>
    <text x="820" y="765" text-anchor="middle" font-size="12" font-weight="700" fill="#1a4480" font-family="ui-monospace, 'SF Mono', monospace">implementation-details</text>
    <text x="820" y="787" text-anchor="middle" font-size="10" fill="#565c65">Practical dev checklist for a ticket.</text>
    <text x="820" y="802" text-anchor="middle" font-size="10" fill="#565c65">Invoked by issue-plan in Phase 3.</text>

    <!-- check-tone -->
    <rect x="980" y="740" width="250" height="80" fill="#fffbe8" stroke="#ffbe2e" stroke-width="1" rx="4"/>
    <text x="1105" y="765" text-anchor="middle" font-size="12" font-weight="700" fill="#54278f" font-family="ui-monospace, 'SF Mono', monospace">check-tone</text>
    <text x="1105" y="787" text-anchor="middle" font-size="10" fill="#565c65">Voice gate for any prose output.</text>
    <text x="1105" y="802" text-anchor="middle" font-size="10" fill="#565c65">Pairs with .agents/style/voice.md.</text>

    <!-- security-check -->
    <rect x="1250" y="740" width="270" height="80" fill="#fffbe8" stroke="#ffbe2e" stroke-width="1" rx="4"/>
    <text x="1385" y="765" text-anchor="middle" font-size="12" font-weight="700" fill="#b50909" font-family="ui-monospace, 'SF Mono', monospace">security-check</text>
    <text x="1385" y="787" text-anchor="middle" font-size="10" fill="#565c65">Pre-flight for sensitive content.</text>
    <text x="1385" y="802" text-anchor="middle" font-size="10" fill="#565c65">Sanctioned vs. sensitive classification.</text>
  </g>

  <!-- ============ FOOTER ============ -->
  <line x1="80" y1="870" x2="1520" y2="870" stroke="#e0e0e0" stroke-width="1"/>
  <text x="80" y="895" font-size="10" fill="#71767a">PRE-DEVELOPMENT phases happen before the ticket is pulled to "Selected for Development." Triage proposes priority for all kept tickets; refinement may update it.</text>
  <text x="80" y="912" font-size="10" fill="#71767a">DEVELOPMENT phases happen after. Plan precedes code (and generates implementation-details). Build includes mid-session handoffs. Validate is engineer-side checking. Communicate is the handoff.</text>
  <text x="80" y="929" font-size="10" fill="#71767a">The framework is tool-agnostic. Works with whatever AI client a project sanctions, or paper checklists.</text>
  <text x="80" y="950" font-size="10" fill="#1a4480" font-weight="600">Canonical doc: ai-runbook-jh/README.md</text>
  <text x="450" y="950" font-size="10" fill="#1a4480" font-weight="600">Skills: ai-runbook-jh/skills/</text>
  <text x="700" y="950" font-size="10" fill="#1a4480" font-weight="600">Policy: CivicActions AI Usage Policy + NIST AI RMF</text>

</svg>
